<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPilots - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-card">
    <div class="logo">🎓</div>
    <h1>SkillPilots</h1>
    <p class="muted">Sign in to access your notes</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required placeholder="Enter username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="Enter password">
      <button type="submit">Login</button>
      <p id="message" class="message" aria-live="polite"></p>
    </form>
    <p class="hint">Demo login: any non-empty username and password</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
